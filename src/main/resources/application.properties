flexi.app.name=My Task Manager

# Database Configuration
flexi.jpa.connection.driver_class=com.mysql.cj.jdbc.Driver
flexi.jpa.connection.url=jdbc:mysql://localhost:3306/task-manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
flexi.jpa.connection.username=root
flexi.jpa.connection.password=root

# Hibernate Settings
flexi.jpa.dialect=org.hibernate.dialect.MySQL8Dialect
flexi.jpa.hbm2ddl.auto=update

# Entities packages
flexi.jpa.entity-package=org.itech.framework.javafxapp.demo.data_access.entities