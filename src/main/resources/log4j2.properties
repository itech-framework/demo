# Set root logger level and appenders
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = Console
rootLogger.appenderRef.rolling.ref = RollingFile

# Console Appender
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# Rolling File Appender
appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = D:/logs/demo/app.log
appender.rolling.filePattern = D:/logs/demo/app-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 10

# Framework-specific logging
logger.framework.name = org.itech.framework.fx
logger.framework.level = debug
logger.framework.additivity = false
logger.framework.appenderRef.rolling.ref = RollingFile

# Suppress Hibernate debug logs
logger.hibernate.name = org.hibernate
logger.hibernate.level = warn

logger.hibernate_orm.name = org.hibernate.orm
logger.hibernate_orm.level = warn

logger.hibernate_results.name = org.hibernate.orm.results
logger.hibernate_results.level = error

logger.hibernate_loading.name = org.hibernate.orm.results.loading
logger.hibernate_loading.level = error

# Optionally suppress SQL logging
logger.hibernate_sql.name = org.hibernate.SQL
logger.hibernate_sql.level = warn